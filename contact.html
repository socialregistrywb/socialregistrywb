<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact the West Bengal Social Registry support team.">
    <title>Contact Us | West Bengal Social Registry</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">Social Registry WB</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" style="color: var(--accent-primary);">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-page" style="padding-bottom: 100px;">
        <h1 class="animate-up" style="text-align: center;">Contact Support</h1>
        <p class="animate-up" style="text-align: center; margin-bottom: 50px;">Have questions regarding the Jai Bangla platform or DBT schemes? Reach out to us.</p>
        
        <div class="glass animate-up" style="padding: 40px;">
            <form id="contactForm">
                <div>
                    <label for="name" style="display: block; margin-bottom: 8px; color: var(--text-secondary);">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div>
                    <label for="email" style="display: block; margin-bottom: 8px; color: var(--text-secondary);">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div>
                    <label for="subject" style="display: block; margin-bottom: 8px; color: var(--text-secondary);">Subject</label>
                    <input type="text" id="subject" required placeholder="Query regarding Annapurna Yojana">
                </div>
                <div>
                    <label for="message" style="display: block; margin-bottom: 8px; color: var(--text-secondary);">Message</label>
                    <textarea id="message" rows="5" required placeholder="How can we help you?"></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-bottom" style="border-top: none;">
            &copy; 2026 West Bengal Social Registry Project. All rights reserved.
            <br>
            <a href="privacy.html" style="color: var(--text-secondary); text-decoration: none; margin-right: 15px;">Privacy</a>
            <a href="disclaimer.html" style="color: var(--text-secondary); text-decoration: none;">Disclaimer</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
